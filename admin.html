<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111318">
<title>校园墙 · 管理</title>
<style>
:root{--bg:#0e1013;--card:#181b20;--text:#e9ecf1;--sub:#7f8794;--line:#24282f;--blue:#5b96ff;--red:#ef5b5b;--green:#3fbf72}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;padding-bottom:calc(20px + env(safe-area-inset-bottom))}
header{padding:calc(12px + env(safe-area-inset-top)) 16px 12px;font-weight:700;font-size:17px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
header span{font-size:13px;font-weight:400;color:var(--sub)}
.wrap{padding:14px 12px 0}
#gate{background:var(--card);border-radius:16px;padding:16px;margin-top:6px}
#gate input{width:100%;background:#0b0d10;border:1px solid var(--line);color:var(--text);border-radius:11px;padding:12px;font-size:16px;margin:10px 0 12px;outline:0}
button{border:0;border-radius:11px;font-family:inherit;font-size:15px;font-weight:600;padding:11px 18px}
#go{background:var(--blue);color:#fff;width:100%}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tabs span{flex:1;text-align:center;padding:10px;border-radius:11px;background:var(--card);color:var(--sub);font-size:14px}
.tabs span.on{background:var(--blue);color:#fff}
.post{background:var(--card);border-radius:14px;padding:14px;margin-bottom:10px}
.meta{font-size:12px;color:var(--sub);margin-bottom:8px;display:flex;gap:8px;flex-wrap:wrap}
.meta b{color:var(--text);font-weight:600}
.body{white-space:pre-wrap;word-break:break-word;margin-bottom:8px}
.pic{width:100%;border-radius:10px;margin:6px 0 10px;display:block;max-height:340px;object-fit:cover}
.acts{display:flex;gap:8px;margin-top:6px}
.acts button{flex:1;font-size:14px;padding:10px}
.pass{background:var(--green);color:#fff}
.del{background:#3a1c1c;color:var(--red)}
.empty{text-align:center;color:var(--sub);padding:48px 0;font-size:14px}
#toast{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);background:rgba(40,44,52,.95);color:#fff;padding:10px 18px;border-radius:20px;font-size:14px;opacity:0;transition:.2s;pointer-events:none;z-index:99}
#toast.on{opacity:1}
</style>
</head>
<body>
<header>校园墙 · 管理 <span id="out">退出</span></header>
<div class="wrap">
  <div id="gate">
    <div>输入管理口令</div>
    <input id="pw" type="password" placeholder="口令" autocomplete="off">
    <button id="go">进入</button>
  </div>
  <div id="main" style="display:none">
    <div class="tabs"><span data-t="pending" class="on">待审</span><span data-t="published">已发布</span></div>
    <div id="list"></div>
  </div>
</div>
<div id="toast"></div>
<script>
var SB = 'https://gfzatnioffikxmddljis.supabase.co';
var KEY = 'sb_publishable_NlJVDZQZi2eolG3vYT6Abw_1b3YwCEW';
var $ = function (i) { return document.getElementById(i); };
var pw = '', cur = 'pending', timer;

function toast(m, ms) {
  var t = $('toast'); t.textContent = m; t.className = 'on';
  clearTimeout(timer); timer = setTimeout(function () { t.className = ''; }, ms || 2000);
}
function esc(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function rpc(act, pid) {
  return fetch(SB + '/rest/v1/rpc/admin', {
    method: 'POST',
    headers: { 'apikey': KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify({ s: pw, act: act, pid: pid || null })
  }).then(function (r) {
    return r.text().then(function (t) {
      if (!r.ok) throw new Error(t || ('HTTP ' + r.status));
      return t ? JSON.parse(t) : null;
    });
  });
}
function delImg(url) {
  if (!url) return Promise.resolve();
  var i = url.indexOf('/wall/');
  if (i < 0) return Promise.resolve();
  var name = url.slice(i + 6);
  return fetch(SB + '/storage/v1/object/wall/' + name, {
    method: 'DELETE', headers: { 'apikey': KEY }
  }).catch(function () {});
}
function when(iso) {
  var d = new Date(iso), p = function (n) { return n < 10 ? '0' + n : n; };
  return (d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}
function render(rows) {
  var box = $('list');
  if (!rows || !rows.length) {
    box.innerHTML = '<div class="empty">' + (cur === 'pending' ? '没有待审的，干净' : '还没有已发布的帖子') + '</div>';
    return;
  }
  var h = '';
  for (var i = 0; i < rows.length; i++) {
    var p = rows[i];
    h += '<div class="post" data-id="' + p.id + '">' +
      '<div class="meta"><b>' + esc(p.nick || '匿名') + '</b><span>#' + p.id + '</span><span>' + when(p.created_at) + '</span></div>';
    if (p.body) h += '<div class="body">' + esc(p.body) + '</div>';
    if (p.image_url) h += '<img class="pic" src="' + esc(p.image_url) + '">';
    h += '<div class="acts">' +
      (cur === 'pending' ? '<button class="pass" data-a="pass" data-i="' + p.id + '">通过</button>' : '') +
      '<button class="del" data-a="del" data-i="' + p.id + '" data-u="' + esc(p.image_url || '') + '">删除</button>' +
      '</div></div>';
  }
  box.innerHTML = h;
}
function load() {
  $('list').innerHTML = '<div class="empty">加载中…</div>';
  rpc(cur).then(render).catch(function (e) {
    $('list').innerHTML = '<div class="empty">' + esc(String(e.message).slice(0, 120)) + '</div>';
  });
}
$('go').addEventListener('click', function () {
  pw = $('pw').value.trim();
  if (!pw) { toast('先输口令'); return; }
  try { sessionStorage.setItem('wall_pw', pw); } catch (e) {}
  rpc('pending').then(function (rows) {
    $('gate').style.display = 'none';
    $('main').style.display = 'block';
    render(rows);
  }).catch(function (e) {
    toast('口令不对或没建好', 3000);
  });
});
$('out').addEventListener('click', function () {
  pw = '';
  try { sessionStorage.removeItem('wall_pw'); } catch (e) {}
  $('main').style.display = 'none';
  $('gate').style.display = 'block';
  $('pw').value = '';
});
document.querySelectorAll('.tabs span').forEach(function (s) {
  s.addEventListener('click', function () {
    document.querySelectorAll('.tabs span').forEach(function (x) { x.className = ''; });
    s.className = 'on';
    cur = s.dataset.t;
    load();
  });
});
$('list').addEventListener('click', function (e) {
  var t = e.target;
  if (!t.dataset || !t.dataset.a) return;
  var id = t.dataset.i, a = t.dataset.a, u = t.dataset.u;
  t.disabled = true;
  if (a === 'pass') {
    rpc('pass', id).then(function () { toast('已通过'); load(); })
      .catch(function (e) { toast('失败：' + String(e.message).slice(0, 40), 3000); t.disabled = false; });
  } else {
    if (!confirm('确定删除这条？删了就没了')) { t.disabled = false; return; }
    delImg(u).then(function () { return rpc('del', id); })
      .then(function () { toast('已删除'); load(); })
      .catch(function (e) { toast('失败：' + String(e.message).slice(0, 40), 3000); t.disabled = false; });
  }
});
try {
  var saved = sessionStorage.getItem('wall_pw');
  if (saved) { $('pw').value = saved; $('go').click(); }
} catch (e) {}
</script>
</body>
</html>
