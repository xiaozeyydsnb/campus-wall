<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>校园墙</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,"PingFang SC",sans-serif;background:#f2f3f5;color:#1a1a1a;padding-bottom:30px}
header{position:sticky;top:0;background:#fff;padding:14px 16px;font-size:18px;font-weight:700;border-bottom:1px solid #eee;display:flex;justify-content:space-between;z-index:5}
#refresh{font-size:14px;font-weight:400;color:#2b7cff}
.wrap{padding:12px}
.box{background:#fff;border-radius:14px;padding:12px;margin-bottom:14px}
textarea{width:100%;border:0;outline:0;resize:none;font:16px/1.5 inherit;min-height:88px;background:transparent}
.bar{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
#count{font-size:12px;color:#bbb}
button{border:0;border-radius:10px;background:#2b7cff;color:#fff;font-size:15px;padding:10px 22px;font-weight:600}
button:active{opacity:.7}
.post{background:#fff;border-radius:14px;padding:14px;margin-bottom:10px}
.meta{font-size:12px;color:#9aa0a6;margin-bottom:8px;display:flex;gap:8px;align-items:center}
.dot{width:24px;height:24px;border-radius:50%;flex:0 0 24px}
.body{font-size:15px;line-height:1.65;white-space:pre-wrap;word-break:break-word}
.tip{text-align:center;color:#bbb;font-size:14px;padding:50px 0;line-height:1.8}
#toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:rgba(0,0,0,.82);color:#fff;font-size:14px;padding:10px 18px;border-radius:20px;opacity:0;transition:.25s;pointer-events:none;z-index:99;max-width:80%}
#toast.on{opacity:1}
</style>
</head>
<body>
<header><span>校园墙</span><span id="refresh">刷新</span></header>
<div class="wrap">
  <div class="box">
    <textarea id="txt" maxlength="500" placeholder="说点什么…（匿名）"></textarea>
    <div class="bar"><span id="count">0/500</span><button id="send">发布</button></div>
  </div>
  <div id="list"><div class="tip">加载中…</div></div>
</div>
<div id="toast"></div>
<script>
var SB = 'https://gfzatnioffikxmddljis.supabase.co';
var KEY = 'sb_publishable_NlJVDZQZi2eolG3vYT6Abw_1b3YwCEW';
var txt = document.getElementById('txt');
var send = document.getElementById('send');
var list = document.getElementById('list');
var count = document.getElementById('count');
var toastEl = document.getElementById('toast');
var timer;
function toast(m, ms) {
  toastEl.textContent = m;
  toastEl.className = 'on';
  clearTimeout(timer);
  timer = setTimeout(function () { toastEl.className = ''; }, ms || 2200);
}
function esc(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function api(path, opt) {
  opt = opt || {};
  var h = { 'apikey': KEY, 'Content-Type': 'application/json' };
  if (opt.prefer) h['Prefer'] = opt.prefer;
  return fetch(SB + '/rest/v1/' + path, {
    method: opt.method || 'GET', headers: h,
    body: opt.body ? JSON.stringify(opt.body) : undefined
  }).then(function (r) {
    if (!r.ok) return r.text().then(function (t) { throw new Error(t || r.status); });
    return r.text();
  }).then(function (t) { return t ? JSON.parse(t) : null; });
}
function ago(iso) {
  var d = (Date.now() - new Date(iso).getTime()) / 1000;
  if (d < 60) return '刚刚';
  if (d < 3600) return Math.floor(d / 60) + ' 分钟前';
  if (d < 86400) return Math.floor(d / 3600) + ' 小时前';
  if (d < 604800) return Math.floor(d / 86400) + ' 天前';
  var t = new Date(iso);
  return (t.getMonth() + 1) + '月' + t.getDate() + '日';
}
function hue(s) {
  var h = 0; s = String(s || '匿名');
  for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 360;
  return h;
}
function render(rows) {
  if (!rows || !rows.length) {
    list.innerHTML = '<div class="tip">还没有人发帖<br>做第一个吧</div>';
    return;
  }
  var html = '';
  for (var i = 0; i < rows.length; i++) {
    var p = rows[i];
    html += '<div class="post"><div class="meta">' +
      '<span class="dot" style="background:hsl(' + hue(p.nick) + ',62%,66%)"></span>' +
      '<b>' + esc(p.nick) + '</b><span>' + ago(p.created_at) + '</span></div>' +
      '<div class="body">' + esc(p.body) + '</div></div>';
  }
  list.innerHTML = html;
}
function load(quiet) {
  if (!quiet) list.innerHTML = '<div class="tip">加载中…</div>';
  return api('posts?select=id,created_at,nick,body&order=created_at.desc&limit=100')
    .then(function (rows) { render(rows); })
    .catch(function (e) {
      list.innerHTML = '<div class="tip">加载失败<br><span style="font-size:12px;color:#e55">' +
        esc(String(e.message).slice(0, 150)) + '</span></div>';
    });
}
txt.addEventListener('input', function () { count.textContent = txt.value.length + '/500'; });
send.addEventListener('click', function () {
  var v = txt.value.trim();
  if (!v) { toast('还没写内容呢'); return; }
  send.disabled = true; send.textContent = '发送中';
  api('posts', { method: 'POST', prefer: 'return=minimal', body: { nick: '匿名', body: v } })
    .then(function () {
      txt.value = ''; count.textContent = '0/500'; toast('发出去了');
      return load(true);
    })
    .catch(function (e) { toast('发送失败：' + String(e.message).slice(0, 50), 3000); })
    .then(function () { send.disabled = false; send.textContent = '发布'; });
});
document.getElementById('refresh').addEventListener('click', function () {
  toast('刷新中'); load(true).then(function () { toast('已刷新', 900); });
});
window.addEventListener('error', function (e) { toast('出错了：' + e.message, 4000); });
load();
</script>
</body>
</html>
