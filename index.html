<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f6fa">
<meta name="description" content="山高校园墙：失物招领、出二手、表白、吐槽、求助。">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="山高校园墙">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
<link rel="preconnect" href="https://gfzatnioffikxmddljis.supabase.co" crossorigin>
<title>山高校园墙</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%234f6df5'/%3E%3Ctext x='32' y='45' font-size='36' text-anchor='middle' fill='%23fff' font-family='sans-serif'%3E%E5%B1%B1%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#f5f6fa; --bg2:#e9ecf5; --card:#fff; --text:#0f1420; --sub:#6b7280; --faint:#9aa1ad;
  --line:#eceef4; --brand:#4f6df5; --brand2:#8b5cf6; --soft:rgba(79,109,245,.10);
  --shadow:0 1px 2px rgba(15,20,32,.04),0 10px 26px rgba(15,20,32,.07);
  --gold:#e6b64c; --nb:#fff8e8; --nbline:#ffe4b0; --nbt:#8a5a10;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0b0d13; --bg2:#07080c; --card:#151a24; --text:#e8ecf4; --sub:#8b93a5; --faint:#5d6577;
    --line:#212734; --brand:#6d86ff; --brand2:#a583ff; --soft:rgba(109,134,255,.16);
    --shadow:0 1px 2px rgba(0,0,0,.5); --nb:#241d0f; --nbline:#3d3118; --nbt:#e0b768;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg2)}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  color:var(--text); font-size:15px; -webkit-font-smoothing:antialiased;
}
.app{max-width:620px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;
  padding-bottom:calc(96px + env(safe-area-inset-bottom))}
@media (min-width:700px){ .app{box-shadow:0 0 60px rgba(15,20,32,.08)} }

/* ---------- 顶部 ---------- */
.hero{position:relative;overflow:hidden;color:#fff;
  background:linear-gradient(135deg,#4f6df5 0%,#7a5cf0 52%,#c25ab4 100%);
  padding:calc(16px + env(safe-area-inset-top)) 18px 22px;
  border-radius:0 0 26px 26px;transition:padding .22s ease}
.hero .glow{position:absolute;border-radius:50%;filter:blur(46px);pointer-events:none}
.hero .g1{width:190px;height:190px;background:rgba(255,255,255,.42);top:-92px;right:-46px}
.hero .g2{width:150px;height:150px;background:rgba(255,214,120,.5);bottom:-86px;left:-40px}
.hero-top{position:relative;display:flex;align-items:center;gap:12px;z-index:1}
.logo{width:42px;height:42px;border-radius:14px;background:rgba(255,255,255,.22);
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;
  border:1px solid rgba(255,255,255,.34);flex:0 0 42px}
.hero h1{margin:0;font-size:19px;font-weight:800;letter-spacing:.4px;line-height:1.2}
.hero .sub{margin:3px 0 0;font-size:12px;opacity:.82;letter-spacing:.2px}
.hero.small{padding-bottom:14px}
.hero.small .sub{display:none}
.hero.small .logo{width:36px;height:36px;flex:0 0 36px;border-radius:12px;font-size:17px}
.hero.small h1{font-size:17px}
.round{margin-left:auto;width:36px;height:36px;border-radius:50%;flex:0 0 36px;
  background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.3);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:16px;padding:0;
  backdrop-filter:blur(6px)}
.round:active{transform:scale(.94)}

/* ---------- 分类 ---------- */
.tabs{position:sticky;top:0;z-index:26;display:flex;gap:8px;overflow-x:auto;
  padding:11px 22px 10px 16px;scrollbar-width:none;background:var(--bg);
  border-bottom:1px solid transparent;transition:border-color .2s}
.tabs.stuck{border-color:var(--line)}
.hds{position:sticky;top:0;z-index:26;background:var(--bg);padding:10px 16px 0;transition:box-shadow .2s,border-color .2s;border-bottom:1px solid transparent}
.hds.stuck{border-bottom-color:var(--line);box-shadow:0 8px 20px rgba(16,24,40,.05)}
.hds .tabs{position:static;top:auto;z-index:auto;padding:0 0 10px}
.sbar{display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:0 12px;height:42px;margin-bottom:10px;transition:border-color .18s,box-shadow .18s}
.sbar:focus-within{border-color:rgba(79,109,245,.55);box-shadow:0 0 0 3px rgba(79,109,245,.12)}
.sic{flex:0 0 auto;color:var(--muted);display:flex}
.sbar input{flex:1;min-width:0;border:0;background:transparent;outline:none;font-size:14px;color:var(--text);font-family:inherit}
.sbar input::placeholder{color:var(--muted)}
.sbar input::-webkit-search-cancel-button{display:none}
.qx{display:none;flex:0 0 auto;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;border:0;box-shadow:none;background:var(--bg);color:var(--muted);font-size:14px;line-height:1;padding:0}
.sbar.on .qx{display:flex}
.sbar.on{background:var(--card)}
.tabs::-webkit-scrollbar{display:none}
.tabs b{flex:0 0 auto;font-size:13px;font-weight:600;padding:7px 15px;border-radius:14px;
  background:var(--card);color:var(--sub);white-space:nowrap;border:1px solid var(--line);
  transition:.16s}
.tabs b.on{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;border-color:transparent;
  box-shadow:0 4px 14px rgba(79,109,245,.32)}

.wrap{padding:12px 14px 0}

/* ---------- 公告 ---------- */
.notice{display:none;background:var(--nb);border:1px solid var(--nbline);border-radius:16px;
  padding:12px 14px;margin-bottom:12px;gap:10px;align-items:flex-start}
.notice .ni{font-size:15px;line-height:1.5;flex:0 0 auto}
.notice .nt{font-size:13.5px;line-height:1.65;color:var(--nbt);white-space:pre-wrap;word-break:break-word}

/* ---------- 卡片 ---------- */
.post{background:var(--card);border-radius:20px;padding:16px 16px 8px;margin-bottom:12px;
  box-shadow:var(--shadow);position:relative}
.post.vip{border:1px solid rgba(230,182,76,.55);
  box-shadow:0 0 0 1px rgba(230,182,76,.22),0 10px 26px rgba(224,168,60,.16)}
.head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.ava{width:38px;height:38px;border-radius:13px;flex:0 0 38px;display:flex;align-items:center;
  justify-content:center;color:#fff;font-size:15px;font-weight:700;letter-spacing:.5px}
.ava.crown{font-size:19px}
.who{flex:1;min-width:0}
.who b{display:block;font-size:14.5px;font-weight:700;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;line-height:1.35}
.who b.gold{background:linear-gradient(90deg,#c98b1a,#f3cf63 50%,#c98b1a);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.who span{display:block;font-size:11.5px;color:var(--faint);margin-top:2px;letter-spacing:.2px}
.tag{font-size:11px;padding:3px 9px;border-radius:9px;white-space:nowrap;font-weight:600;flex:0 0 auto}
.vb{font-size:10.5px;padding:2px 7px;border-radius:8px;flex:0 0 auto;
  background:linear-gradient(135deg,#f7d774,#e0a83c);color:#4a3200;font-weight:800}
.body{font-size:15px;line-height:1.75;white-space:pre-wrap;word-break:break-word;letter-spacing:.1px}
.body.clamp{display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
.more{font-size:12.5px;color:var(--brand);margin-top:5px;font-weight:600}
.pic{width:100%;border-radius:16px;margin-top:11px;display:block;background:var(--bg2);
  max-height:440px;object-fit:cover}
.acts{display:flex;align-items:center;gap:6px;margin-top:12px;padding:6px 0 6px;
  border-top:1px solid var(--line)}
.act{display:flex;align-items:center;gap:6px;background:transparent;border:0;box-shadow:none;
  color:var(--sub);font-size:13px;font-family:inherit;font-weight:600;
  padding:7px 10px;margin:0 -2px;border-radius:12px;transition:.15s}
.act:active{background:var(--soft)}
.act.on{color:var(--brand);background:var(--soft)}
.act svg{display:block;opacity:.9}
.act.r{margin-left:auto}
.act.lk.on{color:#ef4b6b}
.act.lk.on svg{fill:currentColor;stroke:currentColor}
.act.vw{pointer-events:none;cursor:default;gap:5px;font-size:12.5px}

/* ---------- 评论 ---------- */
.clist{display:block}
.cbox{display:none;margin:2px 0 8px}
.cbox.on{display:block}
.cbox .inner{background:var(--bg);border-radius:14px;padding:10px 12px}
.ci{display:flex;gap:8px;padding:6px 0;font-size:13.5px;line-height:1.6}
.ci+.ci{border-top:1px solid var(--line)}
.ci .cn{flex:0 0 auto;color:var(--brand);font-weight:700;font-size:12.5px;max-width:74px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-top:1px}
.ci .cb{flex:1;word-break:break-word;white-space:pre-wrap}
.ci .cdel{flex:0 0 auto;font-size:12px;color:var(--sub);align-self:flex-start;
  padding:1px 6px;border-radius:8px;background:var(--soft)}
.ci .cdel:active{color:#e5484d}
.delp{margin-left:auto;width:26px;height:26px;padding:0;border:0;box-shadow:none;background:transparent;
  color:var(--sub);display:flex;align-items:center;justify-content:center;border-radius:9px}
.delp:active{color:#e5484d;background:var(--soft)}
.ctip{font-size:12.5px;color:var(--faint);padding:6px 0;text-align:center}
.cinput{display:flex;gap:8px;margin-top:9px}
.cinput input{flex:1;border:1px solid var(--line);background:var(--card);color:var(--text);
  border-radius:12px;padding:10px 13px;font:14px/1.4 inherit;outline:0}
.cinput input:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--soft)}
.cinput button{padding:9px 18px;font-size:13.5px;border-radius:12px}

/* ---------- 骨架 / 空 ---------- */
.sk{background:var(--card);border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.sk i{display:block;background:var(--line);border-radius:8px;height:12px;margin-bottom:10px;
  animation:pulse 1.3s infinite ease-in-out}
.sk i:nth-child(1){width:40%;height:38px;border-radius:13px;margin-bottom:14px}
.sk i:nth-child(2){width:86%}
.sk i:nth-child(3){width:56%}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
.empty{text-align:center;padding:64px 24px;color:var(--sub)}
.empty .big{font-size:40px;margin-bottom:14px}
.empty p{margin:0 0 6px;font-size:14px;line-height:1.7}
.empty small{color:var(--faint);font-size:12px;word-break:break-all}
.ghost{margin-top:16px;background:var(--soft);color:var(--brand);border:0;font-weight:700;
  font-size:14px;padding:11px 22px;border-radius:14px}

/* ---------- FAB ---------- */
.fab{position:fixed;right:calc(50% - 310px + 18px);bottom:calc(22px + env(safe-area-inset-bottom));
  width:58px;height:58px;border-radius:50%;border:0;color:#fff;font-size:28px;font-weight:300;
  line-height:1;display:flex;align-items:center;justify-content:center;z-index:60;
  background:linear-gradient(135deg,#4f6df5,#8b5cf6);box-shadow:0 10px 26px rgba(79,109,245,.42);
  transition:transform .16s}
@media (max-width:660px){ .fab{right:18px} }
.fab:active{transform:scale(.92)}

/* ---------- 发帖弹层 ---------- */
.sheet{position:fixed;inset:0;z-index:95;display:none}
.sheet.on{display:block}
.mask{position:absolute;inset:0;background:rgba(8,10,16,.46);backdrop-filter:blur(3px);
  animation:fade .2s ease}
.sheet-body{position:absolute;left:50%;transform:translateX(-50%);bottom:0;
  width:min(560px,100%);background:var(--card);border-radius:26px 26px 0 0;
  padding:8px 18px calc(18px + env(safe-area-inset-bottom));max-height:90vh;overflow-y:auto;
  animation:up .26s cubic-bezier(.2,.9,.25,1)}
.grab{width:38px;height:4px;border-radius:3px;background:var(--line);margin:4px auto 12px}
.sheet-head{display:flex;align-items:center;margin-bottom:12px}
.sheet-head b{font-size:16px;font-weight:800}
.sheet-head .x{margin-left:auto;width:30px;height:30px;border-radius:50%;background:var(--bg);box-shadow:none;
  color:var(--sub);display:flex;align-items:center;justify-content:center;font-size:15px}
@keyframes up{from{transform:translate(-50%,100%)}to{transform:translate(-50%,0)}}
@keyframes fade{from{opacity:0}to{opacity:1}}

.round.cup{background:rgba(255,255,255,.16)}
#tip{margin-left:auto}
#refresh{margin-left:6px}
.tipfoot{display:flex;justify-content:center;padding:22px 0 28px}
.tipfoot button{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--sub);
  background:var(--card);border:1px solid var(--line);padding:9px 15px;border-radius:14px;box-shadow:none}
.tipfoot button:active{color:var(--brand);border-color:var(--brand)}
.tip-body{max-height:92vh}
.tipnote{font-size:12.5px;line-height:1.7;color:var(--sub);background:var(--soft);border-radius:14px;
  padding:11px 13px;margin:0 0 14px}
.qrbox{background:#fff;border-radius:20px;padding:10px;width:min(232px,64vw);margin:0 auto;
  box-shadow:0 10px 30px rgba(30,40,90,.12)}
.qrbox img{width:100%;display:block;border-radius:12px}
.tiphow{font-size:12px;line-height:1.7;color:var(--faint);text-align:center;margin:12px 0 14px}
.tipamts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:14px}
.tipamts b{font-size:13px;font-weight:700;color:var(--brand);background:var(--soft);
  padding:8px 14px;border-radius:12px;font-variant-numeric:tabular-nums}
.tipamts b:active{background:var(--brand);color:#fff}
.tipbar{display:flex;gap:10px;align-items:center}
.tipopen{flex:1;text-align:center;font-size:14px;font-weight:700;color:var(--sub);
  border:1px solid var(--line);border-radius:14px;padding:12px 0;text-decoration:none}
.tipsave{flex:1;font-size:14px;font-weight:700;color:#fff;padding:12px 0;
  background:linear-gradient(135deg,var(--brand),var(--brand2))}
.tipend{font-size:11.5px;color:var(--faint);text-align:center;margin:14px 0 2px}
.vmode{display:none;align-items:center;gap:8px;font-size:12.5px;color:#8a5a10;background:var(--nb);
  border:1px solid var(--nbline);padding:8px 12px;border-radius:12px;margin-bottom:12px;line-height:1.5}
.vmode.on{display:flex}
.vmode u{font-style:normal;color:#a06d12;text-decoration:underline;margin-left:auto;flex:0 0 auto}

.sheet input.nick{width:100%;border:0;outline:0;background:transparent;color:var(--text);
  font:14px/1.4 inherit;padding:2px 0 10px;border-bottom:1px solid var(--line);margin-bottom:10px}
textarea{width:100%;border:0;outline:0;resize:none;background:transparent;color:var(--text);
  font:16px/1.7 inherit;min-height:104px;padding:0}
textarea::placeholder,input::placeholder{color:var(--faint)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips b{flex:0 0 auto;font-size:12.5px;font-weight:600;padding:6px 13px;border-radius:12px;
  border:1px solid var(--line);color:var(--sub);white-space:nowrap;transition:.15s}
.chips b.on{border-color:transparent;color:#fff;background:linear-gradient(135deg,var(--brand),var(--brand2))}
#pv{display:none;position:relative;margin:12px 0 2px}
#pv img{width:100%;border-radius:16px;display:block;max-height:300px;object-fit:cover}
#pvc{position:absolute;top:9px;right:9px;width:28px;height:28px;display:flex;align-items:center;
  justify-content:center;border-radius:50%;background:rgba(0,0,0,.55);color:#fff}
.bar{display:flex;align-items:center;gap:10px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
#pick{font-size:13.5px;color:var(--brand);font-weight:700;padding:8px 12px;border-radius:12px;
  background:var(--soft)}
#count{font-size:11.5px;color:var(--faint);margin-left:auto}
button{border:0;border-radius:14px;background:linear-gradient(135deg,var(--brand),var(--brand2));
  color:#fff;font-size:15px;padding:11px 24px;font-weight:700;font-family:inherit;
  box-shadow:0 6px 18px rgba(79,109,245,.28)}
button:active{opacity:.8}

/* ---------- 大图 / toast / 公告弹窗 ---------- */
#viewer{display:none;position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:100;
  align-items:center;justify-content:center}
#viewer.on{display:flex}
#viewer img{max-width:100%;max-height:100%;object-fit:contain}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));
  transform:translateX(-50%);background:rgba(16,19,26,.92);color:#fff;font-size:13.5px;
  padding:11px 20px;border-radius:16px;opacity:0;transition:opacity .22s;pointer-events:none;
  z-index:120;max-width:82%;text-align:center;backdrop-filter:blur(8px)}
#toast.on{opacity:1}
#pop{display:none;position:fixed;inset:0;background:rgba(8,10,16,.5);z-index:110;
  align-items:center;justify-content:center;padding:26px;backdrop-filter:blur(2px)}
#pop.on{display:flex}
.pcard{background:var(--card);border-radius:22px;padding:22px 20px 18px;width:100%;max-width:340px;
  box-shadow:0 24px 70px rgba(0,0,0,.36);animation:pin .24s ease-out}
@keyframes pin{from{transform:scale(.94);opacity:0}to{transform:scale(1);opacity:1}}
.pttl{font-size:13px;font-weight:700;color:var(--sub);margin-bottom:10px;letter-spacing:.5px}
.pbody{font-size:14.5px;line-height:1.8;color:var(--text);white-space:pre-wrap;word-break:break-word;
  max-height:52vh;overflow-y:auto;margin-bottom:18px}
#pok{width:100%;padding:13px;font-size:15px}
</style>
</head>
<body>
<div class="app">
  <header class="hero" id="hero">
    <div class="glow g1"></div><div class="glow g2"></div>
    <div class="hero-top">
      <div class="logo" id="brand" role="button" tabindex="0" aria-label="山高校园墙">山</div>
      <div style="min-width:0">
        <h1>山高校园墙</h1>
        <p class="sub">失物 · 二手 · 表白 · 吐槽 · 求助</p>
      </div>
      <button class="round cup" id="tip" aria-label="请我喝一杯"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8h1a3 3 0 0 1 0 6h-1"/><path d="M3 8h15v6a5 5 0 0 1-5 5H8a5 5 0 0 1-5-5z"/><path d="M6 2v3M10 2v3M14 2v3"/></svg></button>
      <button class="round" id="refresh" aria-label="刷新"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"/><path d="M20.5 15a9 9 0 1 1-2.1-9.4L23 10"/></svg></button>
    </div>
  </header>

  <div class="hds" id="hds">
    <div class="sbar" id="sbar">
      <span class="sic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg></span>
      <input id="q" type="search" inputmode="search" enterkeyhint="search" autocomplete="off" placeholder="搜索帖子内容、昵称或 #编号" aria-label="搜索帖子">
      <button class="qx" id="qc" type="button" aria-label="清空搜索">×</button>
    </div>
    <div class="tabs" id="tabs"></div>
  </div>

  <div class="wrap">
    <div class="notice" id="notice"><span class="ni"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11v2a1 1 0 0 0 1 1h2l4 4V6L6 10H4a1 1 0 0 0-1 1z"/><path d="M15.5 8.5a4 4 0 0 1 0 7"/><path d="M18.5 5.5a8 8 0 0 1 0 13"/></svg></span><div class="nt" id="ntext"></div></div>
    <div id="list"></div>

      toast('失败：' + friendly(e.message), 3000);
    });
}
function queryStr() {
  var q = 'posts?select=id,created_at,nick,body,image_url,tag,vip,comments_count,like_count,view_count' +
          '&status=eq.published&order=created_at.desc&limit=' + PAGE;
  if (cur) q += '&tag=eq.' + encodeURIComponent(cur);
  if (kw) {
    if (/^[0-9]{1,9}$/.test(kw)) q += '&id=eq.' + kw;
    else {
      var ws = kw.replace(/[,()*%$\\]/g, ' ').split(/\s+/).filter(Boolean).slice(0, 3);
      if (ws.length === 1) {
        var k = ws[0];
        q += '&or=(body.ilike.*' + encodeURIComponent(k) + '*,nick.ilike.*' + encodeURIComponent(k) + '*)';
      } else if (ws.length > 1) {
        var andB = ws.map(function (w) { return 'body.ilike.*' + encodeURIComponent(w) + '*'; }).join(',');
        var andN = ws.map(function (w) { return 'nick.ilike.*' + encodeURIComponent(w) + '*'; }).join(',');
        q += '&or=(and(' + andB + '),and(' + andN + '))';
      }
    }
  }
  if (lastTs) q += '&created_at=lt.' + encodeURIComponent(lastTs);
  return q;
}
function load(quiet) {
  var my = ++seq;
  if (!quiet) skeleton();
  lastTs = null; hasMore = true; loadingMore = false;
  return api(queryStr())
    .then(function (rows) {
      if (my !== seq) return null;
      render(rows);
      return rows;
    })
    .catch(function (e) {
      if (my !== seq) return;
      list.innerHTML = '<div class="empty"><div class="big">📡</div><p>连不上服务器</p>' +
        '<p>换个网络，再点右上角刷新</p><small>' + esc(friendly(e.message)) + '</small></div>';
    });
}
function more() {
  if (!hasMore || loadingMore || !lastTs) return;
  loadingMore = true;
  var my = seq;
  api(queryStr())
    .then(function (rows) {
      loadingMore = false;
      if (my !== seq) return;
      appendRows(rows || []);
    })
    .catch(function () { loadingMore = false; });
}

(function wireSearch() {
  var qEl = $('q'), qcEl = $('qc'), bar = $('sbar'), hd = $('hds');
  function sync() { bar.classList.toggle('on', !!qEl.value.trim()); }
  function commit(force) {
    var v = qEl.value.trim();
    if (v === kw && !force) return;
    kw = v;
    sync();
    window.scrollTo({ top: 0, behavior: 'smooth' });
    load();
  }
  qEl.addEventListener('input', function () {
    sync();
    clearTimeout(kwTimer);
    kwTimer = setTimeout(function () { commit(false); }, 400);
  });
  qEl.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); clearTimeout(kwTimer); commit(true); qEl.blur(); }
    if (e.key === 'Escape') { qEl.value = ''; clearTimeout(kwTimer); commit(true); }
  });
  qcEl.addEventListener('click', function () {
    qEl.value = ''; clearTimeout(kwTimer); commit(true); qEl.focus();
  });
})();

send.addEventListener('click', function () {
  if (busy) return;
  var v = txt.value.trim(), n = nick.value.trim() || '匿名';
  if (!v && !blob) { toast('写点字或者加张图'); return; }
  busy = true;
  send.textContent = blob ? '传图中' : '发送中';
  (blob ? upload(blob) : Promise.resolve(null))
    .then(function (url) {
      send.textContent = '发送中';
      if (isVip()) {
        return api('rpc/post_vip', {
          method: 'POST', prefer: 'return=minimal',
          body: { s: vk(), b: v, tg: pickTag || null, img: url, n: n, dv: VID }
        });
      }
      return api('rpc/submit_post', {
        method: 'POST', prefer: 'return=minimal',
        body: { p_nick: n, p_body: v, p_img: url, p_tag: pickTag || null, p_dev: VID }
      });
    })
    .then(function (res) {
      if (res && res.id) mineAdd('p', res.id);
      var hadImg = !!blob;
      txt.value = ''; count.textContent = '0/500'; clearImg(); pickTag = ''; buildChips();
      closeSheet();
      toast(hadImg ? '图片已提交，等审核' : '已发布', 2600);
      return load(true);
    })
    .catch(function (e) {
      toast('失败：' + friendly(e.message), 3500);
    })
    .then(function () { busy = false; send.textContent = '发布'; });
});

var viewIO = null, viewSeen = {};
function watchViews() {
  if (!window.IntersectionObserver) return;
  if (!viewIO) {
    viewIO = new IntersectionObserver(function (ents) {
      for (var i = 0; i < ents.length; i++) {
        var en = ents[i];
        if (!en.isIntersecting) continue;
        var el = en.target;
        var id = el && el.dataset ? el.dataset.post : null;
        if (!id) continue;
        viewIO.unobserve(el);
        if (viewSeen[id]) continue;
        viewSeen[id] = 1;
        api('rpc/bump_view', { method: 'POST', body: { p_id: Number(id), p_dev: VID } })
          .then(function (r) {
            if (!r || !r.count) return;
            var sp = el.querySelector('.vw span');
            if (sp) sp.textContent = r.count;
          })
          .catch(function () {});
      }
    }, { threshold: 0.55 });
  }
  var nodes = list.querySelectorAll('.post[data-post]:not([data-vw])');
  for (var k = 0; k < nodes.length; k++) {
    nodes[k].setAttribute('data-vw', '1');
    viewIO.observe(nodes[k]);
  }
}

list.addEventListener('click', function (e) {
  var t = e.target;

  if (t.id === 'emptySend') { openSheet(); return; }

  var lk = t.closest ? t.closest('[data-like]') : null;
  if (lk) {
    if (lk.dataset.busy) return;
    lk.dataset.busy = '1';
    var lid = Number(lk.dataset.like);
    api('rpc/toggle_like', { method: 'POST', body: { p_id: lid, p_dev: VID } })
      .then(function (r) {
        delete lk.dataset.busy;
        if (!r) return;
        if (r.liked) { lk.classList.add('on'); mineAdd('l', lid); }
        else { lk.classList.remove('on'); mineDrop('l', lid); }
        var sp = lk.querySelector('span');
        if (sp) sp.textContent = r.count ? r.count : '赞';
      })
      .catch(function (err) {
        delete lk.dataset.busy;
        toast(friendly(err.message), 2600);
      });
    return;
  }
  if (t.dataset && t.dataset.expand) {
    var b = t.previousElementSibling;
    if (b) { b.classList.remove('clamp'); t.style.display = 'none'; }
    return;
  }
  if (t.dataset && t.dataset.img) {
    viewimg.src = t.dataset.img;
    viewer.className = 'on';
    return;
  }
  var cmtBtn = t.closest ? t.closest('[data-cmt]') : null;
  if (cmtBtn) {
    var pid = cmtBtn.dataset.cmt;
    var box = list.querySelector('[data-box="' + pid + '"]');
    if (!box) return;
    if (box.classList.contains('on')) {
      box.classList.remove('on');
      cmtBtn.classList.remove('on');
    } else {
      box.classList.add('on');
      cmtBtn.classList.add('on');
      loadComments(pid, box);
    }
    return;
  }
  if (t.dataset && t.dataset.send) {
    var pid2 = t.dataset.send;
    var box2 = list.querySelector('[data-box="' + pid2 + '"]');
    if (box2) sendComment(pid2, box2);
    return;
  }
  var dp = t.closest ? t.closest('[data-delp]') : null;
  if (dp) {
    var pd = dp.dataset.delp;
    if (!confirm('删除后就没法恢复了，确定删除？')) return;
    dp.disabled = true;
    api('rpc/delete_own_post', { method: 'POST', prefer: 'return=minimal', body: { p_id: Number(pd), p_dev: VID } })
      .then(function () {
        mineDrop('p', pd);
        var art = list.querySelector('[data-post="' + pd + '"]');
        if (art) art.parentNode.removeChild(art);
        toast('已删除');
      })
      .catch(function (e) { dp.disabled = false; toast('删不掉：' + friendly(e.message), 3200); });
    return;
  }
  var dc = t.closest ? t.closest('[data-delc]') : null;
  if (dc) {
    var cid = dc.dataset.delc, cp = dc.dataset.pid;
    if (!confirm('删除这条评论？')) return;
    api('rpc/delete_own_comment', { method: 'POST', prefer: 'return=minimal', body: { p_id: Number(cid), p_dev: VID } })
      .then(function () {
        mineDrop('c', cid);
        var box3 = list.querySelector('[data-box="' + cp + '"]');
        if (box3) loadComments(cp, box3);
        var card3 = list.querySelector('[data-post="' + cp + '"]');
        var lab3 = card3 ? card3.querySelector('[data-cmt]') : null;
        if (lab3) {
          var sp3 = lab3.querySelector('span');
          var mm3 = /(\d+)/.exec((sp3 || lab3).textContent);
          var nx3 = (mm3 ? Math.max(+mm3[1] - 1, 0) : 0);
          var tx3 = nx3 ? '评论 ' + nx3 : '评论';
          if (sp3) sp3.textContent = tx3; else lab3.textContent = tx3;
        }
        toast('评论已删除');
      })
      .catch(function (e) { toast('删不掉：' + friendly(e.message), 3200); });
    return;
  }
  var shBtn = t.closest ? t.closest('[data-share]') : null;
  if (shBtn && shBtn.dataset.share !== undefined) {
    var text = shBtn.dataset.share;
    var link = location.origin + location.pathname + (shBtn.dataset.pid ? '#p=' + shBtn.dataset.pid : '');
    if (navigator.share) {
      navigator.share({ title: '山高校园墙', text: text, url: link }).catch(function () {});
    } else if (navigator.clipboard) {
      navigator.clipboard.writeText(text + ' ' + link).then(function () { toast('已复制'); })
        .catch(function () { toast('复制失败'); });
    } else { toast('长按复制地址分享'); }
  }
});
